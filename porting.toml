[[area]]
id = "input"
status = "implemented"
components = ["QcomGeniSpi", "FuxiFtsTouch"]
paths = ["drivers/FuxiFtsTouch", "drivers/FuxiFtsTouch/**", "include/FuxiTouch*", "package/*Touch*", "scripts/*touch*", "facts/touch_*", "tests/**"]
inputs = ["Stock device tree (OS3.0.309 vendor_boot DTB[2] with dtbo[4], merged with fdtoverlay): /soc/qcom,qupv3_1_geni_se@ac0000/spi@a90000/fts@0, compatible st,spi, 12 MHz, SPI mode 0.", "Controller ST FingerTip FTM5, chip id 36 40, firmware 53.42 kept in its own flash (/proc/tp_fw_version on Android), tp-vendor 0x38.", "Bus QUP1 SE4 at 0xa90000, wrapper 0xac0000, SMMU stream 0xa3; pins 44-47 (qup1_se4); interrupt GPIO 25 (active low, TLMM summary SPI 208); reset GPIO 24.", "Rails vdd ldob12 1.8 V (RPMh 0x40900) and avdd ldom6 3.2 V (RPMh 0x41b00), measured with root on Android; their only consumer is spi0.0."]
configuration = ["board.toml [components] selects QcomGeniSpi and FuxiFtsTouch; [kernel] archives runs scripts/build-fuxi-touch.py.", "configs/fuxi_defconfig links build/fuxi-touch/libFuxiTouch.a through CONFIG_XNU_EXTRA_LD_ARCHIVES; patches/xnu/fuxi-touch-probe.patch calls native_touch_probe() from bsd_init after IOKitInitializeTime().", "Boot arguments: fuxi-touch=1..4, fuxi-touch-panic=1 or 2, fuxi-touch-hz, fuxi-touch-power, fuxi-touch-tcs, fuxi-touch-poll, fuxi-touch-map. board.toml sets fuxi-touch=3 fuxi-touch-panic=1."]
procedure = ["Stage 1: snapshot of the QUP clocks, the pins and the two rails in the command database.", "Stage 2: RPMh votes vdd then avdd in active TCS 2 of apps RSC DRV2 (tcs-offset 0xd00), wait 3 ms, vote the QUP clocks, configure the pins.", "Stage 3: GENI SPI at 12 MHz; reset low 10 ms; wait for event 03 (2 ms polls, 100 ms, three tries, then the ICR 4-wire fallback and the chip id); read the chip id.", "Stage 4: A0 00 00, 50 ms, A0 00 01; falling-edge interrupt; drain the FIFO; publish contacts in the ShengHidInput ABI.", "Host: run the FuxiFtsTouch tests and tests/board_test.c (README)."]
findings = ["The fts_spi driver dispatches events on the high nibble of byte 0, whose bits 2-3 carry the top of the major axis, so 0x13 to 0x1F are all enter events.", "Coordinates are ten times the panel pixels (fts,support-super-resolution): 0..10800 x 0..24000; the probe maps them to the 30480 x 20320 range that ShengHidInput scales from.", "Both touch rails stay on while Android runs, also with the screen off, and carry no boot-on property, so the probe votes them before it touches the controller."]
completion = ["Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]
limits = ["No device evidence. Unverified: whether the RPMh done bit sets without the TCS interrupt enabled, the axis directions, and the HID orientation on a portrait panel.", "GENI has no setting for the 10 us chip-select hold the vendor driver uses (SPI_DELAY_CS)."]
next_action = ["Boot an image with fuxi-touch=3 fuxi-touch-panic=1 and read the FTS rows on the panic screen: reset result 0 and chip id 36 40."]
evidence = [
  { kind = "source", reference = "https://github.com/OddlyLabs/FuxiFtsTouch", result = "FTM5 protocol and contact tracking with host tests" },
  { kind = "source", reference = "package/FuxiTouchProbe.cpp", result = "Staged board probe" },
  { kind = "source", reference = "fuxi_touch_panel_porting.md", result = "Touch facts with sources and the Android measurements (sections 2 and 6)" },
]

