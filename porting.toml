schema_version = 1

[device]
name = "fuxi"
soc = "SM8550"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi 13 (fuxi). Board files from the UniXNU device template, the FTM5 touch driver and its staged kernel probe; CI builds the kernel, the payload, the DEBUG firmware and the fastboot boot image. No device boot evidence yet."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".github/**", ".gitignore", ".gitattributes", "local.toml.example", "LICENSE"]
inputs = ["UniXNU examples/device template (SM8550, iPadOS 17.7.11 profile).", "UniXNU-sm8550-common at 23b2049fcd9e30356161def84231334fb55ecca9."]
configuration = ["board.toml: name fuxi, kit fuxi, soc_source sm8550, os_profile ipados-17.7.11-21H461, device_tree.source device:dts/fuxi.dts.", "configs/fuxi_defconfig: the template options, CONFIG_XNU_NATIVE_ADRENO off (the SoC fragment turns it on), and CONFIG_XNU_EXTRA_LD_ARCHIVES for the touch archive. The arch fragment sets CONFIG_XNU_BUILD_ARCHIVES, CONFIG_XNU_NATIVE_AES, CONFIG_XNU_NATIVE_ARCH_TIMER and CONFIG_XNU_NATIVE_PAN; the OS fragment sets CONFIG_XNU_SOURCE_MOCKFS.", "[kernel] archives in build order: corecrypto (plain and namespaced), ArmDTPlatform, ArmCpu, SoftwareAES and its bindings, libpthread, the mockfs fixture, build-fuxi-touch.py.", "board.toml [payload] entry_probe_reset_delay = 6 (this fork, 2026-11-01): entry-probe reset checkpoint after the MMU is on, added after the first device boot stalled at the magenta bar.", "board.toml [payload] panic_screen = false for the reset-delay diagnostic build only (Build #3): the panic screen and the stage-3 reset do not fit together (see diagnostics findings); restore it afterwards.", "board.toml [payload] entry_probe_reset_after = \"_arm_vm_init\" with entry_probe_reset_delay = 6 (this fork, 2026-11-01): stage 4 moves the timed reset to just after the _arm_vm_init call in _arm_init, bisecting early init now that Build #3 proved the MMU enable completes; panic_screen stays false while bisecting.", "board.toml [payload] entry_probe_reset_in = \"_arm_vm_init\" with entry_probe_reset_after = \"_arm_vm_prot_init\" (Build #6): Build #5's after-_arm_vm_init reset never fired on the device, so the bisection moves inside _arm_vm_init; _arm_vm_prot_init is a real (non-inlined) call about halfway through it.", "board.toml [payload] entry_probe_reset_after = \"_PE_parse_boot_argn\" in _arm_vm_init (Build #7): Build #6's after-_arm_vm_prot_init reset never fired either, so the stall is in the first half of _arm_vm_init; the parse call sits right after the segment walk/assert block.", "board.toml [payload] (Build #10, this fork, 2026-11-02): the entry-probe reset keys are removed and panic_screen = true is restored - the reset bisection ended when Build #8 device-confirmed the cluster-type root cause; the boot now proceeds past early init to bsd_init and the touch probe (kernel_args unchanged: fuxi-touch=3, fuxi-touch-panic=1).", "board.toml [payload] (Build #11, this fork, 2026-11-02): entry_probe_reset_delay = 6 with entry_probe_reset_after = \"_bsd_init\", entry_probe_reset_in = \"_kernel_bootstrap_thread\" and entry_probe_reset_before = true - a timed reset just before the only direct _bsd_init call site, bisecting whether the device kernel reaches bsd_init after Build #10 froze without a panic screen; panic_screen = false again while a reset cave is in use."]
procedure = ["./unixnu defconfig fuxi_defconfig -D ../unixnu-fuxi", "./unixnu status --json", "./unixnu build kernel"]
findings = ["CI (.github/workflows/build.yml) pins OddlyLabs/UniXNU and OddlyLabs/uefi-fuxi at full revisions; after merging upstream into either fork, update UNIXNU_REF or UEFI_REF and let the image job run again.", "The image job installs Homebrew's openssl@3 itself rather than relying on the runner image: the encryption step uses OpenSSL 3 (PBKDF2 for the image, RSA-OAEP with SHA-256 for its key).", "The host tests byte-compile scripts/*.py and ci/*.py and parse ci/decrypt-boot-image.sh with bash -n, so the image tools are checked on every push.", "The merged configuration is the arch, SoC and OS fragments followed by the defconfig; the archive list has to cover every archive the merged options require, not only those of the template defconfig.", "CONFIG_XNU_SOURCE_MOCKFS (OS fragment) makes vfs_conf.o reference mockfs, so the link needs build/mockfs-fixture/libmockfs_fixture.a: the first CI kernel build at 450f518 applied all 62 patches and built every listed archive, then stopped at that missing archive.", "ArmCpu needs the source corecrypto provider, so corecrypto is built before the components, as in UniXNU-sheng.", "The pinned tooling supports the entry-probe stage 4 reset: OddlyLabs/UniXNU branch fuxi's patch-xnu-entry-probe.py takes --reset-after/--in/--occurrence and scripts/unixnu/payload.py maps entry_probe_reset_after/_in/_occurrence from board.toml (both read at the pin, 2026-11-01).", "Host analysis of the decrypted Build #5 kernel.macho (symbols intact): in the compiled _arm_vm_init (0x1390 bytes) the \"Unsupported memory configuration\" panic compares mem_size against ~0xD_FFFFFFFF (~56 GiB), above the ADT dram-size (2 GiB), darwinboot-memory-size (4.75 GiB) and the unit's real 12 GiB, so that panic is ruled out; _arm_replace_identity_map and _init_ptpages are inlined and have no symbols, so stage 4 cannot target them, while _vm_set_page_size, _arm_vm_prot_init, _set_mmu_ttb and _pmap_bootstrap are real calls.", "Call-site geography of _arm_vm_init in the Build #6 kernel.macho: the 24 _getsegdatafromheader calls span 0xfffffff0073e98fc to 0xfffffff0073e9d54 (the segment layout assert block), _PE_parse_boot_argn follows at 0xfffffff0073e9d78, then _getlastkerneladdr, _vm_set_page_size and _arm_vm_prot_init at 0xfffffff0073e9f24; the Build #6 payload-patch log names that same 0x9f24 site, cross-checking the host disassembly against the CI patch.", "Build #10 configuration change (2026-11-02): with the entry-probe reset keys removed from board.toml [payload], the panic screen fits again - Build #2's overflow came from combining it with the stage-3 reset cave; the payload step of Build #10 is the first CI confirmation of the restored combination.", "The pinned patch-xnu-entry-probe.py supports --reset-before (reset at the call site before invoking the named symbol, requires --reset-after); scripts/unixnu/payload.py maps entry_probe_reset_before from board.toml. In the Build #10 kernel the only direct call to _bsd_init is at _kernel_bootstrap_thread+0x3e0 (0xfffffff00798f75c), verified by disassembly of the decrypted artifact."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["unixnu.lock is not committed yet."]
next_action = ["Run ./unixnu fetch and commit unixnu.lock."]
evidence = [
  { kind = "source", reference = "board.toml", result = "Board selection and archive order" },
  { kind = "host", command = "./unixnu defconfig fuxi_defconfig; ./unixnu build kernel", revision = "8b4c03f69fc15878d7ee92c0f157215fa235d78d", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41261795785", result = "All sources resolved, 62 patches applied, nine archives built, kernel linked and prelinked" },
]

[[area]]
id = "firmware"
status = "host-verified"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt"]
inputs = ["OddlyLabs/uefi-fuxi, branch fuxi: a fork of UniXNU/uefi-sheng (the official Mu-Silicium fork for UniXNU) with the nine fuxi bring-up commits of matejkoo217/uefi-fuxi cherry-picked (authors kept, cherry-pick -x); its fuxiPkg derives from Silicium's SM8550 nuwa (Xiaomi 13 Pro).", "fastboot boot of the image (temporary, nothing is written to the device)."]
configuration = ["board.toml [firmware]: config fuxi, dsc Platforms/Xiaomi/fuxiPkg/fuxi.dsc, fd Build/fuxiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd, and the submodules, edk2 patch and package path list of UniXNU-sheng's [firmware].", "fuxi.dsc: FUXI_VENDOR_HW = 0 (Mu drivers only; the previous stage keeps the panel scanning out), framebuffer 1080x2400x32, DDR base 0x80000000, the UniXNU menu, UniXNUDxe, DarwinBoot, DiskIo, Partition and FAT; FuxiBootMemoryDxe publishes the payload volume the shim hands over."]
procedure = ["./unixnu build firmware --uefi ../uefi-fuxi --target DEBUG (CI: the image job of .github/workflows/build.yml)."]
findings = ["UniXNU provides the boot menu (UniXNUPkg) and the XNU loader (DarwinBoot) as UEFI modules; the board firmware that runs them on the phone is a Mu-Silicium platform, and upstream Mu-Silicium has no fuxi platform.", "Measured on hardware in matejkoo217/uefi-fuxi: with text offset 0 in the shim's ARM64 header the ABL loads the image and the firmware's DEBUG console prints on the panel; with the firmware address there the ABL answers Load Error.", "The firmware's FdtBlob (sm8550-xiaomi-fuxi.dtb, model 8550 fuxi, msm-id 0x207, board-id 0x10008) carries the root properties the ABL selects an appended DTB by; the DTB merged from OS3.0.309 keeps the base DTB's board-id 0 and is not used for the boot image.", "fuxiPkg Include/RAW.inc listed the vendor raw files SecParti.cfg, uefipil.cfg and QcomChargerCfg.cfg outside the FUXI_VENDOR_HW gate, so the first firmware build in CI (run 41268231266 at 72300f2) stopped at the missing Binaries/nuwa/RawFiles/SecParti.cfg; uefi-fuxi 87554bf9 gates them with their drivers.", "With FUXI_VENDOR_HW = 0 the volume holds UniXNU, UniXNUDxe, DarwinBoot, FuxiBootMemoryDxe, SimpleFbDxe, FAT, PartitionDxe and DiskIoDxe. FuxiGopLogDxe and FuxiDisplayDepexDxe are compiled but enter the volume only with USE_CUSTOM_DISPLAY_DRIVER = 1."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["No device evidence with this exact checkout: the hardware results above are matejkoo217's and Kerfand's (who reached XNU with the same commits through a fork)."]
next_action = ["Boot the CI image with fastboot boot and confirm the UniXNU menu and the DarwinBoot handoff."]
evidence = [
  { kind = "source", reference = "https://github.com/OddlyLabs/uefi-fuxi/tree/fuxi", result = "Firmware fork with the fuxi platform" },
  { kind = "host", command = "./unixnu build firmware --uefi ../uefi-fuxi --target DEBUG (Ubuntu 26.04, clang 21.1.8, uefi-fuxi 87554bf90a6f5707ceeb3720b3dc507de914db94, UniXNU 6ae4c252937ae1920ab68eaded10fc78447e0194)", revision = "72300f2b07ccee230e07caa7b31f5af269b4f942", reference = "https://github.com/OddlyLabs/uefi-fuxi/commit/87554bf90a6f5707ceeb3720b3dc507de914db94", result = "DEBUG SILICIUM_UEFI.fd built at 0x300000 bytes with the UniXNU menu, UniXNUDxe, DarwinBoot and FuxiBootMemoryDxe in the volume" },
  { kind = "host", command = "./unixnu build firmware --uefi ../uefi-fuxi --target DEBUG", revision = "2bbd3993e97081db16d8ecc00c58c78f53200b8e", reference = "https://github.com/OddlyLabs/unixnu-fuxi/actions/runs/41273003819", result = "DEBUG firmware from uefi-fuxi 87554bf9 built on macOS 26 at 0x300000 bytes (fd_sha256 627fe52af360...) and packed into the boot image" },
]

[[area]]
id = "cpu"
status = "planned"
components = []
paths = ["package/CpuFreq*", "scripts/*armcpu*"]
inputs = ["CPU layout and GIC ranges of SM8550 v2 (soc_id 519) from the stock device tree."]
configuration = ["The template ArmCpu and ArmDTPlatform selection."]
procedure = ["Boot to the XNU entry checkpoint and record the enabled CPUs."]
findings = ["No fuxi CPU observation yet.", "Root cause of the early-boot stall (rig-verified 2026-11-02): the payload ADT carried unixnu,cluster-type from dts/fuxi.dts (E on cpu0-2, P on cpu3-7, copied from the sheng pattern), but this fork's kernel has no cluster support (MAX_CPU_CLUSTER_PHY_ID = 0), so ml_parse_cpu_topology asserts phys_cluster_id <= MAX_CPU_CLUSTER_PHY_ID at the first P CPU (cpu3) during _arm_init, before _arm_vm_init is ever called; the panic then faults in panic_trap_to_debugger on a TPIDR_EL1=0 percpu access and wedges silently. The compiled kernel reads only the ADT cluster-type property for this (missing = SMP default); the reg Aff1 values (0x000..0x700) are the stock Qualcomm convention and are not the input. Both fuxi lines that boot (SadNutWall, mouse233) write no cluster-type in their ADTs."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["Hardware inputs are not recorded in dts/fuxi.dts beyond the SoC DTSI."]
next_action = ["Boot the Build #8 image (first without the cluster-type overrides) and record how far early init gets on the device; the QEMU rig already shows it entering _arm_vm_init."]
evidence = [{ kind = "host", command = "QEMU rig (AAVMF + virt): esp staged with the Build #7 kernel/ADT, cluster-type removed from the ADT copy, gdb breakpoints at _Assert/_panic/_arm_vm_init/_current_percpu_base", revision = "2dfc82de6e00035d6741888043e0f239b0a68f6d", reference = "https://github.com/kkkpc/unixnu-fuxi-oneclick/actions/runs/41316686953", result = "With cluster-type present the Build #7 kernel panics in ml_parse_cpu_topology (assert at machine_routines.c:1099) before _arm_vm_init and the panic self-masks via a TPIDR_EL1=0 percpu access in panic_trap_to_debugger; with the property removed from the ADT copy the same kernel passes the topology parse, enters _arm_vm_init and executes the stage-4 cave through its PSCI SYSTEM_RESET smc (x0=0x84000009)" }]

