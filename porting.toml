findings = ["The other fuxi ports read their results from panic screen photographs as well.", "The DEBUG firmware prints its log on the panel before the handoff (matejkoo217/uefi-fuxi), the only console before the touch report.", "The earlier ci/ scripts compiled the probe inside a UniXNU-sheng build; the fuxi kernel build replaces them.", "ci/check-boot-image.py checks a decrypted image before fastboot boot against boot.json, board.toml and the firmware checkout: container and load addresses, the shim header, the firmware volume, the payload files, the ADT root and /chosen values, and the boot arguments.", "patch-xnu-entry-probe.py cannot combine the panic screen with the stage-3 reset on this kernel: with the stage-3 cave in use the panic cave shifts one 0x60 cave later, leaving 0x9D0 bytes, and the 0xA1F-byte panic screen overflows by 79 bytes (Build #2, run 41308851945, Build payload failed in 2 s on this SystemExit; with --no-reset it had fitted with 17 bytes to spare).", "Build #3's stage-3 reset fired ~6 s after the magenta bar on the owner's unit (video, 2026-11-01): the MMU enable completes; the stall is after MMU-on, inside arm_init before bsd_init, so the reset checkpoint now bisects _arm_init's calls (stage 4, --reset-after).", "Build #5's stage-4 reset (after _arm_vm_init) never fired on the owner's unit (2026-11-01): the magenta bar held 30+ s, so the kernel does not return from _arm_vm_init; the stall or an early panic is inside it, and the bisection moves inside _arm_vm_init.", "Build #6's stage-4 reset (after _arm_vm_prot_init, inside _arm_vm_init) never fired either (2026-11-01, photograph in the owner's bench records): the stall is in the first half of _arm_vm_init, before _arm_vm_prot_init returns - the physmap setup, the inlined initial page tables, the segment walk/assert block or the boot-arg parse.", "CORRECTION (2026-11-02, QEMU rig breakpoints on the Build #7 kernel): the kernel never enters _arm_vm_init at all - it panics earlier, in _arm_init's ml_parse_cpu_topology, on the phys_cluster_id assert (see the cpu area), so every stage-4 checkpoint sat after the panic point and could never fire; the 'first half of _arm_vm_init' attribution is superseded. With the ADT cluster-type removed, the same kernel enters _arm_vm_init and runs the stage-4 cave to its PSCI reset smc.", "Build #8 CONFIRMED ON THE DEVICE (2026-11-02): the stage-4 reset fired on the owner's fuxi for the first time - magenta bar, automatic reboot about 6 s later, normal HyperOS boot. The cluster-type fix holds on hardware; early init now passes the topology assert, enters _arm_vm_init and reaches the _PE_parse_boot_argn checkpoint. The line is parked here as a working spare route; the SadNutWall line remains the mainline.", "Build #10 returns this line to its functional target (2026-11-02, at the owner's direction to continue the oneclick line as the active route): no entry-probe reset, panic screen restored. Expected device readout is the touch probe's own panic in bsd_init (fuxi-touch-panic=1) showing its four diagnostic rows - the result this fork was built to collect.", "Build #10 device result (2026-11-02): the boot froze at the three bars for 60+ s - no panic screen, so the probe readout never appeared; the stall is after the Build #8 checkpoint and before the probe runs. The QEMU rig ran the same artifact to IOKit service matching and rendered its panic screen there, but its terminal AppleARMCPU device-tree assert is very likely virt-only, so the rig cannot localize the device stall; Build #11 bisects on the device at the _bsd_init call."]
completion = ["Each claimed milestone has a reproducible command, a matching source/image revision and an accessible result."]
limits = ["Device evidence so far is the handoff-bar photograph (Build #1), the reset-timing video (Build #3), the no-reset observations (Builds #5/#6) and the owner's typed reset-timing report (Build #8); Build #10 adds a bars photograph and a 60+ s no-panic-screen observation. No device log or rendered panic screen has been captured on the device."]
next_action = ["Boot the Build #11 image (stage-4 reset before the _bsd_init call in _kernel_bootstrap_thread): an automatic reset within 60 s of the bars means the device kernel reaches bsd_init and the stall is in or after it (the probe or its readout); frozen bars at 60 s+ put the stall between IOKit matching and the bsd_init call."]
