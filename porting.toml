configuration = ["dts/fuxi.dts includes sm8550.dtsi and sets model and compatible; package/SmmuBypass.h is the UniXNU-sheng pass-through stream helper the touch probe uses for stream 0xa3.", "dts/fuxi.dts no longer stamps unixnu,cluster-type on the CPUs (Build #8): the property made the payload ADT trip the kernel's CPU-topology assert; see the cpu area findings."]
